name: CPU replay and smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and the kit
        run: |
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Causal input and output checks
        run: python -m unittest discover -s tests -v
      - name: Verify all models and replay all recorded traces
        run: python -m spatial_memory_kit verify --root . > replay-verification.json
      - name: Run a short independent training check
        run: python -m spatial_memory_kit smoke-train --root . --output smoke-run > smoke-verification.json
